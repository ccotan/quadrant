<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrant — Заявка</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='20' y='20' width='25' height='25' fill='white' rx='4'/><rect x='55' y='20' width='25' height='25' fill='white' rx='4'/><rect x='20' y='55' width='25' height='25' fill='white' rx='4'/><rect x='55' y='55' width='25' height='25' fill='white' rx='4'/></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>

    <div class="splash-screen" id="splashScreen">
        <div class="splash-icon">
            <div class="splash-square"></div>
            <div class="splash-square"></div>
            <div class="splash-square"></div>
            <div class="splash-square"></div>
        </div>
    </div>

    <nav class="navbar" id="navbar">
        <a href="index.html" class="nav-left">
            <div class="nav-logo-icon">
                <div class="nav-logo-square"></div>
                <div class="nav-logo-square"></div>
                <div class="nav-logo-square"></div>
                <div class="nav-logo-square"></div>
            </div>
            <div class="nav-logo-text">Quadrant</div>
        </a>
        <div class="nav-center">
            <a href="index.html" class="nav-btn active">Заявка</a>
            <a href="wiki.html" class="nav-btn">Вики</a>
        </div>
        <div class="nav-right">
            <button class="profile-btn">
                <div class="profile-icon">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <span>Профиль</span>
                <span class="profile-arrow">▼</span>
            </button>
        </div>
    </nav>

    <div class="scroll-indicator" id="scrollIndicator">
        <div class="scroll-dots" id="scrollDots">
            <div class="scroll-dot" data-section="0"><div class="scroll-dot-label">Заявка</div></div>
            <div class="scroll-dot" data-section="1"><div class="scroll-dot-label">Вики</div></div>
            <div class="liquid-drop" id="liquidDrop"></div>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <section class="section" id="section-0">
            <!-- Apply Button Section Only -->
            <div class="apply-section">
                <div class="apply-container">
                    <h3 class="apply-title">Подать заявку</h3>
                    <p class="apply-subtitle">
                        Присоединяйтесь к Quadrant и станьте частью системы, обеспечивающей безопасность цифровых пространств
                    </p>
                    <button class="apply-button" onclick="handleApplyClick()">
                        <svg viewBox="0 0 24 24">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="8.5" cy="7" r="4"/>
                            <line x1="20" y1="8" x2="20" y2="14"/>
                            <line x1="23" y1="11" x2="17" y2="11"/>
                        </svg>
                        Подать заявку
                    </button>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
